# Standalone, theme-focused Starship example. No personal paths or usernames.
# For existing prompt layouts, use starship/palette.toml instead.
palette = 'aura_dracula_spirit_synthwave'

format = """
[](fg:red)\
[  ](bg:red fg:crust)\
[](fg:red bg:peach)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$nodejs\
$python\
$rust\
[](fg:green bg:sapphire)\
[  ](bg:sapphire fg:crust)\
[](fg:sapphire bg:lavender)\
$time\
[](fg:lavender)\
$line_break\
$character"""

[directory]
style = 'bg:peach fg:crust'
format = '[ $path ]($style)'
truncation_length = 3

[git_branch]
symbol = ''
style = 'bg:yellow fg:crust'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'bg:yellow fg:crust'
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
style = 'bg:green fg:crust'
format = '[  $version ]($style)'

[python]
style = 'bg:green fg:crust'
format = '[  $version ]($style)'

[rust]
style = 'bg:green fg:crust'
format = '[  $version ]($style)'

[time]
disabled = false
time_format = '%R'
style = 'bg:lavender fg:crust'
format = '[  $time ]($style)'

[character]
success_symbol = '[❯](bold fg:#61ffca)'
error_symbol = '[❯](bold fg:#ff6767)'

[palettes.aura_dracula_spirit_synthwave]
# Six distinct interpolated segment colors across the existing Powerline bar.
# pink → orchid → violet → periwinkle → aqua → mint
base = "#262335"
crust = "#262335"
text = "#cdccce"
red = "#f477ff"
peach = "#d377ff"
yellow = "#b277ff"
green = "#9592f4"
sapphire = "#7bc9df"
lavender = "#61ffca"
# Contrast-conscious custom icon accents.
acc_blue = "#34387c"
acc_red = "#8d2451"
acc_peach = "#6e3b20"
acc_yellow = "#6e4320"
acc_green = "#165842"
acc_teal = "#12544d"
acc_sapphire = "#134f57"
acc_mauve = "#45225f"
acc_maroon = "#7a2551"
acc_pink = "#77244c"
